    <h2>E2E/Feature Testing</h2>

    <p class="lead">The obvious test: decode it. We didn't.</p>

    <ul>
      <li>Most likely failure: <strong>the gem stops generating</strong> &mdash; upgrade, or fork drift.</li>
      <li>Decoding means a whole new gem, for one test.</li>
      <li>Screenshot then decode: slow, brittle across both drivers.</li>
    </ul>
