<!DOCTYPE html>

<head>
  <meta charset="utf-8">

  <title>Choosing a gem</title>
  <link rel="stylesheet" href="deck.css">

</head>
<body>
<div class="slide">

    <h2>Choosing a gem</h2>

    <ul>
      <li><strong>rqrcode</strong> &mdash; pure Ruby, maintained, renders SVG. <em>Chosen.</em></li>
      <li><strong>rqrcode_core</strong> &mdash; encoder only. rqrcode is the thin bit on top.</li>
      <li><strong>barby</strong> &mdash; a dozen symbologies. Too much for one code.</li>
      <li><strong>libqrencode bindings</strong> &mdash; C extension, build toolchain.</li>
    </ul>

    <p class="lead">Fewest dependencies wins. And <em>SVG, not PNG</em>.</p>

</div>
</body>
</html>
